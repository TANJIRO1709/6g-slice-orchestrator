# Render blueprint — free tier, no credit card required.
#
# This targets the SLIM image (Dockerfile.slim), which serves the PPO
# policy from NumPy weights instead of torch. The full image needs
# ~600 MB resident and would be OOM-killed on Render's 512 MB free
# plan; the slim image runs in roughly 300 MB.
#
# Before deploying, generate the weights once on your own machine:
#     cd backend && ./venv/bin/python export_policy.py
#     git add -f backend/models/policy_weights.npz
#
# Deploy: push this file at the repo root, then in the Render
# dashboard choose New → Blueprint and point it at the repository.

services:
  - type: web
    name: 6g-slice-orchestrator
    runtime: docker
    dockerfilePath: ./Dockerfile.slim
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/state
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # set manually in the dashboard, never in git
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: DIAGNOSE_EVERY
        value: "20"            # keeps LLM calls inside the Gemini free quota
